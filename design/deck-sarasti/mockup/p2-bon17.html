<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>P2 BON17</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0B1828; }
  body { position: relative; font-family: 'Montserrat', Arial, sans-serif; color: #F3EBDD; }
  .bg { position: absolute; left: -80px; top: -80px; width: 1240px; height: 1510px; object-fit: cover; filter: blur(22px) brightness(0.62) saturate(0.85); }
  .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(19,39,63,0.35), rgba(11,24,40,0.55)); }
  .center { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
  .small { font-style: italic; font-size: 32px; letter-spacing: 0.02em; color: #F3EBDD; }
  .big { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 168px; line-height: 0.86; letter-spacing: -0.02em; color: #F6EEDF; margin-top: 18px; }
  .sub { font-size: 36px; line-height: 1.3; letter-spacing: 0.04em; color: #F3EBDD; margin-top: 44px; }
  .logo { position: absolute; left: 50%; top: 1030px; width: 210px; margin-left: -105px; }
  .badge { position: absolute; left: 50%; top: 1150px; transform: translateX(-50%); padding: 4px 16px; border: 1.5px solid rgba(243,235,221,0.75); border-radius: 8px; font-size: 18px; font-weight: 500; letter-spacing: 0.28em; color: #F3EBDD; }
</style>
</head>
<body>
  <img class="bg" src="hab-bon17.jpg" alt="">
  <div class="tint"></div>
  <div class="center">
    <p class="small">Llega, conéctate y trabaja</p>
    <p class="big">y descansa<br>de verdad</p>
    <p class="sub">Hospédate en BON17<br>by Sarasti</p>
  </div>
  <img class="logo" src="sarasti-white.png" alt="Sarasti">
  <p class="badge">BON17</p>
</body>
</html>
