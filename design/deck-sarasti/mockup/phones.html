<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sarasti Phones Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Pinyon+Script&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #13273F; }
  body { position: relative; font-family: 'Montserrat', Arial, sans-serif; color: #EDE3D1; }
  .texture { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }

  /* Empty panel on the right */
  .panel { position: absolute; left: 830px; top: -30px; width: 1000px; height: 1070px; border-radius: 0 0 34px 34px; background: rgba(9, 20, 34, 0.35); border: 1.5px solid rgba(237, 227, 209, 0.16); box-shadow: 0 30px 80px rgba(4, 10, 18, 0.35); }

  /* Phone hardware */
  .phone { position: absolute; border-radius: 62px; background: linear-gradient(145deg, #2A2E36, #0E1015 60%, #23262D); padding: 12px; box-shadow: 0 40px 90px rgba(4, 10, 18, 0.65), inset 0 0 0 2px rgba(255,255,255,0.08); }
  .phone::before { content: ''; position: absolute; right: -4px; top: 190px; width: 4px; height: 90px; border-radius: 0 3px 3px 0; background: #1B1E24; }
  .phone::after { content: ''; position: absolute; left: -4px; top: 160px; width: 4px; height: 60px; border-radius: 3px 0 0 3px; background: #1B1E24; box-shadow: 0 80px 0 #1B1E24; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #13273F; }
  .island { position: absolute; left: 50%; top: 12px; width: 112px; height: 32px; margin-left: -56px; border-radius: 20px; background: #05070A; z-index: 10; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; font-size: 15px; font-weight: 600; color: #FBF6EC; z-index: 9; }
  .status .icons { display: flex; gap: 6px; align-items: center; }

  /* Phone 1: Sarasti gallery page */
  .hero { position: absolute; left: 0; top: 0; width: 100%; height: 330px; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,24,40,0.75) 0%, rgba(19,39,63,0.25) 40%, rgba(19,39,63,0.85) 100%); }
  .hbar { position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; justify-content: space-between; }
  .hbar img { height: 34px; }
  .pill { padding: 7px 14px; border-radius: 999px; background: rgba(237,227,209,0.85); color: #13273F; font-size: 12px; font-weight: 600; }
  .burger { display: flex; flex-direction: column; gap: 4px; } .burger span { width: 20px; height: 2px; background: #FBF6EC; }
  .htitle { position: absolute; left: 0; right: 0; top: 168px; text-align: center; font-family: 'Pinyon Script', cursive; font-size: 66px; color: #FBF6EC; text-shadow: 0 3px 20px rgba(5,12,22,0.6); }
  .orn { position: absolute; left: 50%; top: 258px; width: 150px; margin-left: -75px; }
  .crumb { position: absolute; left: 22px; top: 352px; font-size: 13px; color: rgba(237,227,209,0.85); }
  .chips { position: absolute; left: 16px; right: 10px; top: 386px; display: flex; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; color: rgba(237,227,209,0.9); }
  .chip.on { background: #2B4566; border: 1px solid rgba(237,227,209,0.3); }
  .grid { position: absolute; left: 14px; right: 14px; top: 440px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
  .grid img.tall { height: 200px; }

  /* Phone 2: Instagram post */
  .ig-top { position: absolute; left: 0; right: 0; top: 54px; height: 46px; display: flex; align-items: center; padding: 0 18px; gap: 14px; border-bottom: 1px solid rgba(237,227,209,0.1); }
  .ig-top .t { font-size: 15px; font-weight: 600; color: #FBF6EC; }
  .ig-top .s { font-size: 11px; color: rgba(237,227,209,0.6); margin-top: 2px; }
  .ig-head { position: absolute; left: 0; right: 0; top: 110px; height: 56px; display: flex; align-items: center; padding: 0 14px; gap: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #C9A45C, #EDE3D1); }
  .avatar div { width: 100%; height: 100%; border-radius: 50%; background: #13273F; display: flex; align-items: center; justify-content: center; }
  .avatar img { width: 26px; }
  .ig-name { font-size: 13px; font-weight: 600; color: #FBF6EC; }
  .ig-loc { font-size: 11px; color: rgba(237,227,209,0.65); }
  .dots { margin-left: auto; font-size: 18px; color: #FBF6EC; letter-spacing: 1px; }
  .post { position: absolute; left: 0; right: 0; top: 168px; height: 336px; }
  .post img { width: 100%; height: 100%; object-fit: cover; }
  .post .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(19,39,63,0.55) 0%, rgba(19,39,63,0.05) 45%, rgba(11,24,40,0.55) 100%); }
  .post .tl { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-family: 'Pinyon Script', cursive; font-size: 46px; color: #FBF6EC; text-shadow: 0 3px 16px rgba(5,12,22,0.5); }
  .post .tl2 { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.38em; color: #FBF6EC; }
  .post img.mark { position: absolute; left: 50%; bottom: 18px; width: 86px; height: auto; margin-left: -43px; }
  .actions { position: absolute; left: 14px; right: 14px; top: 516px; display: flex; gap: 16px; align-items: center; }
  .actions svg { width: 24px; height: 24px; }
  .actions .save { margin-left: auto; }
  .likes { position: absolute; left: 14px; top: 556px; font-size: 13px; font-weight: 600; color: #FBF6EC; }
  .caption { position: absolute; left: 14px; right: 14px; top: 580px; font-size: 13px; line-height: 1.45; color: rgba(237,227,209,0.92); }
  .caption b { color: #FBF6EC; }
  .when { position: absolute; left: 14px; top: 642px; font-size: 11px; color: rgba(237,227,209,0.5); }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(237,227,209,0.1); background: #0F2034; }
  .tabbar svg { width: 24px; height: 24px; }
</style>
</head>
<body>
  <img class="texture" src="texture-navy.jpg" alt="">
  <div class="panel"></div>

        <svg width="18" height="12" viewBox="0 0 18 12" fill="#FBF6EC"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#FBF6EC" stroke-opacity="0.6"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#FBF6EC"/><rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="#FBF6EC" fill-opacity="0.6"/></svg></span></div>
      <div class="hero"><img src="h-lobby.jpg" alt=""><div class="shade"></div></div>

      <svg class="orn" viewBox="0 0 150 16" fill="none" stroke="#FBF6EC" stroke-width="1.2"><path d="M0 8 H58"/><path d="M92 8 H150"/><path d="M75 2 C68 8 68 8 75 14 C82 8 82 8 75 2 Z"/><circle cx="62" cy="8" r="1.6" fill="#FBF6EC"/><circle cx="88" cy="8" r="1.6" fill="#FBF6EC"/></svg>

      <div class="chips"><span class="chip on">Todo</span><span class="chip">Hotel</span><span class="chip">Suites</span><span class="chip">Restaurante</span></div>
      <div class="grid">
        <img class="tall" src="suite.jpg" alt="">

        <img src="h-spa.jpg" alt="">
        <img class="tall" src="restaurant.jpg" alt="" style="margin-top:-50px">
      </div>
    </div>
  </div>

  <!-- Phone 2: Instagram post -->
  <div class="phone" style="left:440px; top:230px; width:352px; height:740px">
    <div class="screen" style="background:#0F2034">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#FBF6EC"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#FBF6EC" stroke-opacity="0.6"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#FBF6EC"/><rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="#FBF6EC" fill-opacity="0.6"/></svg></span></div>
      <div class="ig-top">

      <div class="post">

        <svg viewBox="0 0 24 24" fill="#E25C5C" stroke="#E25C5C" stroke-width="1.6"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.6" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 1 1-3.6-6.9A8.5 8.5 0 0 1 20.5 11.5z"/><path d="M20.5 20.5l-2.4-3.6"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.6" stroke-linejoin="round"><path d="M21.5 3 L2.5 10.5 L10 13.5 L13 21 Z"/><path d="M10 13.5 L21.5 3"/></svg>
        <svg class="save" viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg>
      </div>
      <p class="likes">1.248 Me gusta</p>
      <p class="caption"><b>sarastihotels</b> Mañanas que se quedan contigo. Reserva directo y disfruta beneficios exclusivos.</p>
      <div class="tabbar">
        <svg viewBox="0 0 24 24" fill="#FBF6EC"><path d="M3 10.5 L12 3 L21 10.5 V21 H15 V14.5 H9 V21 H3 Z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5 L15.5 12 L10 15.5 Z" fill="#FBF6EC"/></svg>
        <div class="avatar" style="width:26px; height:26px; padding:1.5px"><div><img src="sarasti-white.png" alt="" style="width:18px"></div></div>
      </div>
    </div>
  </div>
</body>
</html>
