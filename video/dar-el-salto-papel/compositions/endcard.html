<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"tagline","type":"string","label":"Tagline","default":"La Casa del Marketing"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #15131a;
        }
        /* La luz del fondo del sombrero se vuelve el amanecer de la marca */
        #end-light {
          position: absolute;
          left: 90px;
          top: 560px;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 196, 118, 0.42), rgba(214, 140, 64, 0.2) 45%, rgba(18, 12, 7, 0) 100%);
        }
        #end-lockup {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #end-logo {
          display: block;
          width: 400px;
          height: 213px;
        }
        #end-tagline {
          display: block;
          margin-top: 46px;
          font-family: var(--co-font-display);
          font-style: italic;
          font-weight: 400;
          font-size: 44px;
          letter-spacing: 0.01em;
          color: #f4e7cb;
        }
      </style>

      <div id="root" data-composition-id="endcard" data-width="1080" data-height="1920">
        <div id="end-light"></div>
        <div id="end-lockup">
          <img id="end-logo" src="assets/brand/logo-co-light.png" alt="C&amp;O" />
          <span id="end-tagline" data-var-text="tagline">La Casa del Marketing</span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#end-light", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 2.4, ease: "sine.out" }, 0);
        tl.fromTo("#end-logo", { opacity: 0, scale: 0.96, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.6, ease: "sine.out" }, 0.35);
        tl.fromTo("#end-tagline", { opacity: 0, y: 12, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.3, ease: "sine.out" }, 1.1);
        tl.to("#end-lockup", { opacity: 0, filter: "blur(6px)", duration: 1.1, ease: "sine.in" }, 3.0);
        tl.to("#end-light", { opacity: 0, duration: 1.2, ease: "sine.in" }, 2.9);
        window.__timelines["endcard"] = tl;
      </script>
    </template>
  </body>
</html>
