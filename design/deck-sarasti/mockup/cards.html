<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sarasti Cards Mockup</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #13273F; }
  body { position: relative; }
  .texture { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; filter: brightness(0.88); }
  svg { position: absolute; left: 0; top: 0; }
  .card { position: absolute; border-radius: 36px; }
  .top { left: 96px; top: 150px; width: 1728px; height: 371px; background: rgba(237, 227, 209, 0.035); border: 1.5px solid rgba(237, 227, 209, 0.14); }
  .left { left: 96px; top: 560px; width: 838px; height: 371px; background: #2B4566; border: 1.5px solid rgba(237, 227, 209, 0.2); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .right { left: 970px; top: 560px; width: 854px; height: 371px; background: rgba(9, 20, 34, 0.22); border: 1.5px solid rgba(237, 227, 209, 0.14); }
</style>
</head>
<body>
  <img class="texture" src="texture-navy.jpg" alt="">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <radialGradient id="disc" cx="960" cy="-46" r="600" gradientUnits="userSpaceOnUse">
        <stop offset="0.6" stop-color="#22395A" stop-opacity="0"/>
        <stop offset="0.97" stop-color="#22395A" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#22395A" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="960" cy="-46" r="600" fill="url(#disc)"/>
    <g fill="none" stroke="#FFFFFF">
      <circle cx="960" cy="-46" r="595" stroke-opacity="0.10" stroke-width="1.4"/>
      <circle cx="960" cy="-46" r="572" stroke-opacity="0.07" stroke-width="1.1"/>
      <circle cx="960" cy="-46" r="556" stroke-opacity="0.07" stroke-width="1.1"/>
      <circle cx="960" cy="-46" r="540" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="960" cy="-46" r="512" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="960" cy="-46" r="486" stroke-opacity="0.05" stroke-width="1"/>
    </g>
  </svg>
  <div class="card top"></div>
  <div class="card left"></div>
  <div class="card right"></div>
</body>
</html>
