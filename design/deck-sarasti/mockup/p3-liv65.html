<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>P3 LIV 65</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #13273F; }
  body { position: relative; font-family: 'Inter', Arial, sans-serif; color: #FFFFFF; }
  .bg { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover; object-position: 38% 50%; filter: saturate(0.9); }
  .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,24,40,0.55) 0%, rgba(19,39,63,0.25) 35%, rgba(19,39,63,0.35) 70%, rgba(11,24,40,0.75) 100%); }
  .title { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 128px; line-height: 0.95; letter-spacing: -0.01em; text-shadow: 0 6px 30px rgba(5,12,22,0.45); }
  .title i { font-style: italic; }
  .list { position: absolute; left: 245px; top: 440px; width: 590px; display: flex; flex-direction: column; gap: 18px; }
  .item { height: 92px; border-radius: 46px; display: flex; align-items: center; padding: 0 30px; gap: 22px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.28); backdrop-filter: blur(14px); }
  .item svg { width: 34px; height: 34px; flex: none; }
  .item .t { flex: 1; text-align: center; font-size: 26px; font-weight: 500; color: rgba(255,255,255,0.95); }
  .item .more { font-size: 24px; letter-spacing: 2px; color: rgba(255,255,255,0.9); }
  .item.on { background: rgba(255,255,255,0.97); border-color: transparent; }
  .item.on .t { color: #0A0A0A; font-weight: 600; line-height: 1.15; }
  .item.on .t small { display: block; font-size: 19px; font-weight: 400; color: #555; }
  .item.on .more { color: #0A0A0A; }
  .foot { position: absolute; left: 0; right: 0; bottom: 58px; text-align: center; }
  .foot .name { font-family: 'Instrument Serif', Georgia, serif; font-size: 78px; line-height: 1; }
  .foot .by { font-size: 17px; font-weight: 500; letter-spacing: 0.4em; margin-top: 8px; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <img class="bg" src="hab-liv.jpg" alt="">
  <div class="tint"></div>
  <p class="title">Cada viaje<br>tiene su <i>ritmo</i></p>
  <div class="list">
    <div class="item on">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6 L18.4 18.4"/></svg>
      <p class="t">No molestar<small>Activado</small></p><span class="more">•••</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="11" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
      <p class="t">Escritorio de trabajo</p><span class="more">•••</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r="1" fill="#FFFFFF"/></svg>
      <p class="t">Wi-Fi de alta velocidad</p><span class="more">•••</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5c-.8 1 .8 2-.1 3M12 3.5c-.8 1 .8 2-.1 3"/></svg>
      <p class="t">Desayuno temprano</p><span class="more">•••</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <p class="t">Check-out flexible</p><span class="more">•••</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <p class="t">Gimnasio</p><span class="more">•••</span>
    </div>
  </div>
  <div class="foot"><p class="name">LIV 65</p><p class="by">BY SARASTI</p></div>
</body>
</html>
