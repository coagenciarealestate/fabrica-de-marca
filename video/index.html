<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>C&amp;O — Intro de marca</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--co-carbon);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--co-carbon);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #bg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <img
        id="bg"
        class="clip"
        src="assets/brand/bg-texture-dark.jpg"
        alt=""
        data-start="0"
        data-duration="8"
        data-track-index="0"
      />

      <div
        id="hero"
        class="clip"
        data-composition-id="hero"
        data-composition-src="compositions/hero.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="logo-sting"
        class="clip"
        data-composition-id="logo-sting"
        data-composition-src="compositions/logo-sting.html"
        data-start="4"
        data-duration="4"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 0.35, duration: 1, ease: "power1.out" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
