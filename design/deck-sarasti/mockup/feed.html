<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sarasti Instagram Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #13273F; }
  body { position: relative; font-family: 'Inter', Arial, sans-serif; color: #0A0A0A; }
  .texture { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }

  /* Post cards */
  .card { position: absolute; width: 340px; background: #FFFFFF; border-radius: 10px; overflow: hidden; transform: rotate(-8deg); box-shadow: 0 34px 60px rgba(4, 10, 18, 0.55), 0 6px 14px rgba(4, 10, 18, 0.35); }
  .card .hd { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; }
  .av { width: 28px; height: 28px; border-radius: 50%; background: #13273F; border: 1.5px solid #C9A45C; display: flex; align-items: center; justify-content: center; flex: none; }
  .av img { width: 19px; }
  .card .un { font-size: 13px; font-weight: 600; }
  .card .pic { display: block; width: 340px; height: 425px; object-fit: cover; }
  .card .ft { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 12px; }
  .card .ft svg { width: 22px; height: 22px; }
  .ft .bm { margin-left: auto; }

  /* Phone */
  .phone { position: absolute; left: 1170px; top: 110px; width: 540px; height: 1090px; border-radius: 78px; padding: 13px; transform: rotate(-11deg); background: linear-gradient(145deg, #F4F5F7, #C9CCD2 45%, #EEF0F3 70%, #B9BDC4); box-shadow: 0 50px 100px rgba(4, 10, 18, 0.6), inset 0 0 0 2px rgba(255,255,255,0.7), inset 0 0 0 4px rgba(0,0,0,0.08); }
  .phone::before { content: ''; position: absolute; right: -5px; top: 250px; width: 5px; height: 120px; border-radius: 0 4px 4px 0; background: #BFC3CA; }
  .phone::after { content: ''; position: absolute; left: -5px; top: 210px; width: 5px; height: 80px; border-radius: 4px 0 0 4px; background: #BFC3CA; box-shadow: 0 110px 0 #BFC3CA; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 66px; overflow: hidden; background: #FFFFFF; border: 8px solid #0A0A0A; }
  .island { position: absolute; left: 50%; top: 14px; width: 130px; height: 36px; margin-left: -65px; border-radius: 20px; background: #05070A; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 8px 40px 0; font-size: 17px; font-weight: 600; }
  .status .icons { display: flex; gap: 7px; align-items: center; }
  .igbar { position: absolute; left: 0; right: 0; top: 64px; height: 54px; display: flex; align-items: center; padding: 0 20px; gap: 6px; }
  .igbar .acc { font-size: 21px; font-weight: 700; }
  .igbar .r { margin-left: auto; display: flex; gap: 20px; }
  .igbar svg { width: 26px; height: 26px; }
  .phd { position: absolute; left: 0; right: 0; top: 122px; height: 58px; display: flex; align-items: center; padding: 0 14px; gap: 10px; }
  .phd .av { width: 38px; height: 38px; }
  .phd .av img { width: 26px; }
  .phd .un { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .phd .dots { margin-left: auto; font-size: 18px; letter-spacing: 1px; }
  .ppic { position: absolute; left: 0; top: 182px; width: 100%; height: 640px; object-fit: cover; }
  .pact { position: absolute; left: 14px; right: 14px; top: 834px; display: flex; gap: 18px; align-items: center; }
  .pact svg { width: 27px; height: 27px; }
  .plikes { position: absolute; left: 16px; top: 874px; font-size: 15px; font-weight: 600; }
  .pcap { position: absolute; left: 16px; right: 16px; top: 898px; font-size: 14.5px; line-height: 1.4; }
  .pcap span { color: #737373; }
  .tab { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 14px; border-top: 1px solid #EFEFEF; background: #FFFFFF; }
  .tab svg { width: 27px; height: 27px; }
</style>
</head>
