<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>C&amp;O — Dar el salto (papel)</title>
    <!-- Historia, texto y sonido salen de scripts/build-papel.mjs -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #15131a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #15131a;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Grano de película movido por GSAP cada 2 cuadros (seekable) */
      #grain {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.16;
      }
      #grain-tex {
        position: absolute;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      #vignette {
        pointer-events: none;
        background: radial-gradient(120% 85% at 50% 50%, rgba(21, 19, 26, 0) 55%, rgba(21, 19, 26, 0.42) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="story"
        class="clip"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="0"
        data-duration="19.5"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>


      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="19.5"
        data-duration="4.5"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="vignette" class="clip" data-start="0" data-duration="24" data-track-index="5"></div>
      <div id="grain"><div id="grain-tex" data-layout-allow-overflow></div></div>

      <audio
        id="papel-audio"
        src="assets/papel/papel-audio.m4a"
        data-start="0"
        data-duration="24"
        data-track-index="9"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      let seed = 9;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let f = 0; f < 24 * 15; f++) {
        tl.set("#grain-tex", { x: Math.round((rnd() - 0.5) * 400), y: Math.round((rnd() - 0.5) * 700) }, f / 15);
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
